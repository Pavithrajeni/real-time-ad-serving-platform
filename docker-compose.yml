version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: ad-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ad_platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NewPassword123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ad-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: